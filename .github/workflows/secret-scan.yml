name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC 全量扫一次，防止「早就提交过、但规则后来才更新」的漏网密钥
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
