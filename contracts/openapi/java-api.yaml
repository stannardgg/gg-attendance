openapi: 3.0.3
info:
  title: 人脸签到系统 · Java 业务接口
  version: 1.0.0
  description: |
    覆盖 `/api/v1/auth/**`、`/api/v1/mobile/**`、`/api/v1/admin/**` 三组端点。

    **三条契约红线**
    1. `course` 的任何 DTO 都不得出现 `classId`（D7）。请求体一律 `additionalProperties: false`，
       带未知字段直接 400 —— 这是「课程表单提交 classId 必须被拒」的契约级保证。
    2. `POST /admin/sessions` 必须同时含 `classId` 与 `courseId`，缺一即 `FA-2001`。
    3. 响应体统一 `{code, message, data, traceId}`，前端只按 `code` 分支。

    **鉴权**：除 `/auth/**` 外均为 JWT Bearer。数据范围由服务端按 `teacher_scope` 强制注入，
    前端隐藏菜单不构成安全边界（§8.3）。
  license:
    name: 内部项目
servers:
  - url: /
    description: 经 nginx 反代，与前端同源

tags:
  - name: auth
    description: 认证与账号（无需鉴权，除 me/logout）
  - name: mobile
    description: 学生移动端，响应永不包含其他学生信息
  - name: admin-class
    description: 班级管理（独立主数据，与课程无关联）
  - name: admin-course
    description: 课程管理（独立主数据，不含任何班级信息）
  - name: admin-org
    description: 学生、教师、教师授权范围
  - name: admin-session
    description: 签到会话与二维码
  - name: admin-attendance
    description: 考勤查询与调整
  - name: admin-appeal
    description: 申诉处理
  - name: admin-system
    description: 统计、审计、系统配置
  - name: student-profile
    description: 学生密码修改申请（CR-024，自助端仅 STUDENT，审核端在 admin-org）

security:
  - bearerAuth: []

paths:
  # ===================================================================
  # auth
  # ===================================================================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-error-codes: [FA-1001, FA-1002]

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 用 refreshToken 换新的 accessToken
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-error-codes: [FA-1002]

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（把 jti 写入 Redis 黑名单，TTL = 剩余有效期）
      operationId: logout
      responses:
        '200':
          description: 已登出（幂等，重复调用同样返回成功）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResp' }

  /api/v1/auth/student/activate:
    post:
      tags: [auth]
      summary: 学生自助激活
      description: |
        `学号 + 姓名 + 班级邀请码` 三者同时匹配才能激活。任一不匹配返回**同一个**模糊提示，
        不暴露「班级码不存在」与「学号不存在」的区别（§5.3.1，防探测）。
      security: []
      operationId: activateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentActivateReq' }
      responses:
        '200':
          description: 激活成功，直接返回令牌免二次登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1001, FA-1004, FA-2001]

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户、角色、权限点与数据范围
      operationId: me
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===================================================================
  # mobile
  # ===================================================================
  /api/v1/mobile/sessions/active:
    get:
      tags: [mobile]
      summary: 本人当前能签的场次（应到名单快照内、ACTIVE、未过期）
      description: |
        以 `session_expected` 快照为基表，不按 `student.class_id` 现算 ——
        保证「首页列出来的场次，点进去一定换得到票」，且转班不会篡改历史名单。
        最多返回 20 条，按 id 倒序。
      operationId: mobileActiveSessions
      responses:
        '200':
          description: 进行中的会话列表（含班级名与课程名，前端必须两者同显）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSessionListResp' }

  /api/v1/mobile/sessions/{sid}/join:
    post:
      tags: [mobile]
      summary: 进入签到并换取 checkinTicket（无请求体）
      description: |
        学生身份取自 JWT，会话取自路径参数，不需要二维码。

        依次校验：① 会话状态且未过 `endAt`（否则 `FA-3001`）；
        ② 应到名单包含该学生（否则 `FA-3004`）；③ 本场未签过（否则 `FA-3003`）；
        ④ 本场没有待处理的申诉（否则 `FA-5001`「你已提交本次申诉」）——
        申诉与签到互斥，提交后不可再参与该场次；⑤ 刷脸失败次数未达上限
        （否则 `FA-3005`，CR-023）；⑥ 人脸档案为 `ACTIVE`（否则 `FA-4006`）。
        课程不参与校验 —— 应到名单只跟班级走（D7）。
      operationId: joinSession
      parameters:
        - $ref: '#/components/parameters/PathSessionId'
      responses:
        '200':
          description: 票据已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-error-codes: [FA-3001, FA-3003, FA-3004, FA-3005, FA-4006, FA-5001]

  /api/v1/mobile/attendance/{sid}:
    get:
      tags: [mobile]
      summary: 本人在指定会话的签到状态
      operationId: mobileAttendanceOfSession
      parameters:
        - $ref: '#/components/parameters/PathSessionId'
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileAttendanceResp' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mobile/attendance/history:
    get:
      tags: [mobile]
      summary: 本人签到历史
      operationId: mobileAttendanceHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceStatus' }
      responses:
        '200':
          description: 分页历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileHistoryResp' }

  /api/v1/mobile/face/enroll:
    post:
      tags: [mobile]
      summary: 提交人脸采集样本，进入 PENDING_REVIEW
      description: |
        一次提交 5~10 张样本的引用键（图片本身已通过 `/face-api/enroll/sample` 逐张上传并完成质量校验）。
        提交后 `face_profile.status` 转 `PENDING_REVIEW`，需教师审核通过才可变 `ACTIVE`（D5）。
        调用前必须已通过 `POST /api/v1/mobile/face/consent` 记录当前生效版本（v2）的「单独同意」
        （CR-028：事件表 `face_consent_record` + `account.face_consent_at/version`）；
        consentVersion 与当前版本不符或无对应 ACCEPT 事件时 400 `FA-4010`（§13.4，服务端强校验）。
        「一人一档」：提交前对全库他人档案做同脸查重（CR-014），命中即 `FA-4008` 整单拒绝，
        不写向量、不改档案状态。
      operationId: enrollFace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaceEnrollReq' }
      responses:
        '200':
          description: 已提交审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceStatusResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-4010, FA-4001, FA-4002, FA-4008]

  /api/v1/mobile/face/status:
    get:
      tags: [mobile]
      summary: 本人人脸档案状态（含当前同意态）
      operationId: faceStatus
      responses:
        '200':
          description: 状态（consentVersion/consentAt 为撤回或删除后的空态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceStatusResp' }

  /api/v1/mobile/face/consent:
    post:
      tags: [mobile]
      summary: 记录人脸采集「单独同意」（CR-028）
      description: |
        PIPL §29：人脸属敏感个人信息，采集前必须取得单独同意——学生阅读告知全文
        （docs/compliance/face-consent-notice-v2.md）后显式点「同意」时调用；
        勾选框、静默继续、与用户协议捆绑勾选均不构成单独同意。
        事件写入 `face_consent_record`（只增不改），`account.face_consent_at/version`
        保留当前态。幂等：同账号同版本重复调用不产生新事件、不刷新首次同意时间。
        摄像头必须在本次调用成功之后才能启动（前端 EnrollView 强制）。
        consentVersion 非当前生效版本时 400 `FA-4010`。
      operationId: recordFaceConsent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaceConsentReq' }
      responses:
        '200':
          description: 已记录（返回最新档案状态与同意态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceStatusResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
      x-error-codes: [FA-4010]

  /api/v1/mobile/face/data-deletion:
    post:
      tags: [mobile]
      summary: 删除本人人脸数据并撤回同意（数据主体删除权，CR-028）
      description: |
        物理删除本人 `face_vector`（加密向量）与 `face_profile`，写 WITHDRAW 事件并
        清空 `account.face_consent_*`。任意档案状态（PENDING_REVIEW / REJECTED / ACTIVE）
        均可调用；无数据时 404 `FA-2001`。语义边界：由既往签到产生的考勤记录属业务数据，
        不随本次删除清除。删后档案回到 NONE，可重新采集（须重新同意）。
      operationId: deleteFaceData
      responses:
        '200':
          description: 已删除（返回删除后的档案状态，status=NONE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceStatusResp' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001]

  /api/v1/mobile/appeals:
    post:
      tags: [mobile]
      summary: 提交申诉
      description: 仅 `ABSENT` 且会话 `allow_appeal=1` 时可提交；同一考勤记录只允许一条 PENDING。
      operationId: createAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealCreateReq' }
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealResp' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-5001]

  /api/v1/mobile/appeals/{id}/withdraw:
    post:
      tags: [mobile]
      summary: 撤回申诉（仅 PENDING）
      operationId: withdrawAppeal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealResp' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/mobile/ws:
    get:
      tags: [mobile]
      summary: WebSocket 订阅本人签到通知
      description: |
        `101 Switching Protocols`。浏览器 WS 无法设置请求头，故 JWT 走 query 参数 `?token=`。
        订阅频道 `user:{userId}`，收到 `EVT_SESSION_STARTED` / `EVT_SESSION_CLOSED`。
        **本端点不是普通 REST，OpenAPI 仅作登记，不参与代码生成。**
      operationId: mobileWs
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: 协议升级成功
      x-websocket-events:
        - EVT_SESSION_STARTED
        - EVT_SESSION_CLOSED

  # ===================================================================
  # admin · 班级
  # ===================================================================
  /api/v1/admin/classes:
    get:
      tags: [admin-class]
      summary: 班级列表
      operationId: listClasses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          description: 匹配 name 或 code
          schema: { type: string }
        - name: grade
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: 默认只返回 ACTIVE；勾选「显示已归档」时传 ARCHIVED 或 ALL
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL], default: ACTIVE }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-class]
      summary: 新建班级
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassCreateReq' }
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2002, FA-2003]

  /api/v1/admin/classes/{id}:
    put:
      tags: [admin-class]
      summary: 编辑班级（code 不可改）
      description: '请求体不得含 `code`，含则 400（additionalProperties=false 已保证）。'
      operationId: updateClass
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassUpdateReq' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-2003]
    delete:
      tags: [admin-class]
      summary: 删除或归档班级
      description: |
        班内仍有 `status=ACTIVE` 学生 → `FA-2005`（data 带 studentCount）；
        已被任一签到会话引用 → 转为 `ARCHIVED`，不物理删除（§5.3.1）。
      operationId: deleteClass
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已删除或已归档（data.archived 标明走了哪条路径）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResultResp' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-2005]

  # ===================================================================
  # admin · 课程
  # ===================================================================
  /api/v1/admin/courses:
    get:
      tags: [admin-course]
      summary: 课程列表
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          description: 匹配 name 或 code
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL], default: ACTIVE }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoursePageResp' }
    post:
      tags: [admin-course]
      summary: 新建课程（不得含 classId）
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCreateReq' }
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseResp' }
        '400':
          description: 字段校验失败。带 `classId` 等未知字段时也走这里（契约红线，§16.3 场景 16）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2002]

  /api/v1/admin/courses/{id}:
    put:
      tags: [admin-course]
      summary: 编辑课程（code 不可改，不得含 classId）
      operationId: updateCourse
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseUpdateReq' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001]
    delete:
      tags: [admin-course]
      summary: 删除或归档课程
      description: 已被任一签到会话引用 → 转 `ARCHIVED`，不物理删除。
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已删除或已归档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResultResp' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001]

  # --- CR-026 课程授权学生：班级名单之外的课程级签到授权（追加，非选课） ---
  /api/v1/admin/courses/{courseId}/grants:
    get:
      tags: [admin-course]
      summary: 课程授权学生名单（分页）
      operationId: listCourseGrants
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页名单（含学生姓名/学号/班级展示冗余）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseGrantPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001, FA-2006]
    post:
      tags: [admin-course]
      summary: 授权学生（发起签到时并入应到快照）
      operationId: createCourseGrant
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseGrantReq' }
      responses:
        '200':
          description: 已授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseGrantResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-2006, FA-2008]

  /api/v1/admin/courses/{courseId}/grants/{studentId}:
    delete:
      tags: [admin-course]
      summary: 撤销授权（只影响之后新发起的会话）
      operationId: deleteCourseGrant
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: studentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001, FA-2006]

  # ===================================================================
  # admin · 学生
  # ===================================================================
  /api/v1/admin/students:
    get:
      tags: [admin-org]
      summary: 学生列表（按数据范围过滤）
      operationId: listStudents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: keyword
          in: query
          description: 匹配 name 或 studentNo
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StudentStatus' }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPageResp' }
    post:
      tags: [admin-org]
      summary: 新建学生
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentCreateReq' }
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResp' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2002]

  /api/v1/admin/students/{id}:
    put:
      tags: [admin-org]
      summary: 编辑学生（含转班，转班写审计）
      operationId: updateStudent
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentUpdateReq' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResp' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-org]
      summary: 删除学生（有考勤记录时转 ARCHIVED）
      operationId: deleteStudent
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已删除或已归档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResultResp' }

  /api/v1/admin/students/import:
    post:
      tags: [admin-org]
      summary: CSV 批量导入学生
      description: |
        按 `classCode` 定位班级。逐行校验，**已成功的行不回滚**（分批提交）。
        1000 行含 5 行非法 → 995 成功、5 行返回行号与原因（§14.3 WP-03）。
      operationId: importStudents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, classCode]
              properties:
                file:
                  type: string
                  format: binary
                  description: 表头固定 studentNo,name；可选 status
                classCode:
                  type: string
                  description: 班级邀请码；与 CSV 内的列同名冲突时以此为准
      responses:
        '200':
          description: 逐行结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResultResp' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/admin/students/{id}/face/review:
    post:
      tags: [admin-org]
      summary: 人脸采集审核
      description: |
        通过 → `face_profile.status=ACTIVE` 并把样本向量写入 `face_vector`；
        驳回 → `REJECTED` 且必须带 `rejectReason`。仅 ACTIVE 允许签到（`FA-4006`）。
      operationId: reviewFace
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaceReviewReq' }
      responses:
        '200':
          description: 审核结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceStatusResp' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================================================================
  # admin · 教师与授权
  # ===================================================================
  /api/v1/admin/teachers:
    get:
      tags: [admin-org]
      summary: 教师列表（仅 ADMIN）
      operationId: listTeachers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-org]
      summary: 新建教师（仅 ADMIN，角色固定 TEACHER，不接受 role 字段）
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherCreateReq' }
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1003, FA-1005, FA-2002]

  /api/v1/admin/teachers/{id}:
    put:
      tags: [admin-org]
      summary: 编辑教师（仅 ADMIN）
      operationId: updateTeacher
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherUpdateReq' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin-org]
      summary: 删除教师（仅 ADMIN）
      operationId: deleteTeacher
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------------
  # 教师账号与资料修改申请（CR-019 / CR-022）：教师提交 / 管理员审核
  # -------------------------------------------------------------------
  /api/v1/teacher/profile-requests:
    get:
      tags: [teacher-profile]
      summary: 我的修改申请（仅 TEACHER，含历史）
      operationId: listMyProfileRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileRequestPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [teacher-profile]
      summary: 提交修改申请（仅 TEACHER；资料 + 登录用户名 + 密码）
      description: |
        字段为 null 表示本次不申请；department/title 传空串表示清空该字段。
        至少一项与当前值不同，否则 FA-2007；
        申请改 username 或 newPassword 时必须同时提供 currentPassword（校验失败也是 FA-2007，
        刻意不用 FA-1001/401，避免把用户踢回登录页）；
        新密码只存 BCrypt 哈希，明文不落库、不进日志、不进审计；
        同一教师同时只能有一条 PENDING（uk_tpr_pending），重复提交同样是 FA-2007。
      operationId: submitProfileRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequestSubmitReq' }
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1003, FA-2007]

  /api/v1/teacher/profile-requests/{id}/withdraw:
    post:
      tags: [teacher-profile]
      summary: 撤回自己的待审申请（仅 TEACHER）
      operationId: withdrawProfileRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-2007]

  /api/v1/admin/teacher-profile-requests:
    get:
      tags: [admin-org]
      summary: 修改申请列表（仅 ADMIN）
      operationId: listProfileRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: PENDING / APPROVED / REJECTED / WITHDRAWN；空或 ALL 表示全部
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, ALL] }
        - name: keyword
          in: query
          description: 教师姓名或工号
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileRequestPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/teacher-profile-requests/{id}/handle:
    post:
      tags: [admin-org]
      summary: 审核修改申请（仅 ADMIN；通过即写 teacher/account 并记审计）
      operationId: handleProfileRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequestHandleReq' }
      responses:
        '200':
          description: 已审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1003, FA-2001, FA-2007]

  # -------------------------------------------------------------------
  # 学生密码修改申请（CR-024）：学生提交 / 管理员审核
  # -------------------------------------------------------------------
  /api/v1/student/profile-requests:
    get:
      tags: [student-profile]
      summary: 我的密码修改申请（仅 STUDENT，含历史）
      operationId: listMyStudentProfileRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfileRequestPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [student-profile]
      summary: 提交密码修改申请（仅 STUDENT）
      description: |
        学生侧只放开改密一种申请（学号是登录名且由管理员维护）。
        必须提供 currentPassword（校验失败为 FA-2007，刻意不用 FA-1001/401，
        避免把用户踢回登录页）；新密码 8~64 位且同时含字母与数字，
        不能与当前密码相同；只保存 BCrypt 哈希，明文不落库、不进日志、不进审计；
        同一学生同时只能有一条 PENDING（uk_spr_pending），重复提交同样是 FA-2007。
        申请通过后 account.credential_version +1，该账号已签发的全部令牌立即失效。
      operationId: submitStudentProfileRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentProfileRequestSubmitReq' }
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1003, FA-2007]

  /api/v1/student/profile-requests/{id}/withdraw:
    post:
      tags: [student-profile]
      summary: 撤回自己的待审申请（仅 STUDENT）
      operationId: withdrawStudentProfileRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-2001, FA-2007]

  /api/v1/admin/student-profile-requests:
    get:
      tags: [admin-org]
      summary: 学生密码修改申请列表（仅 ADMIN）
      operationId: listStudentProfileRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: PENDING / APPROVED / REJECTED / WITHDRAWN；空或 ALL 表示全部
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, ALL] }
        - name: keyword
          in: query
          description: 学生姓名或学号
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfileRequestPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/student-profile-requests/{id}/handle:
    post:
      tags: [admin-org]
      summary: 审核密码修改申请（仅 ADMIN；通过即写 account.password_hash 并 cv+1）
      operationId: handleStudentProfileRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequestHandleReq' }
      responses:
        '200':
          description: 已审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfileRequestResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-1003, FA-2001, FA-2007]

  /api/v1/admin/teacher-scopes:
    get:
      tags: [admin-org]
      summary: 教师授权范围列表（仅 ADMIN）
      operationId: listTeacherScopes
      parameters:
        - name: teacherId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeListResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-org]
      summary: 新增授权（仅 ADMIN）
      operationId: createTeacherScope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopeCreateReq' }
      responses:
        '200':
          description: 已授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/teacher-scopes/{id}:
    delete:
      tags: [admin-org]
      summary: 撤销授权（仅 ADMIN）
      operationId: deleteTeacherScope
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===================================================================
  # admin · 签到会话
  # ===================================================================
  /api/v1/admin/sessions:
    get:
      tags: [admin-session]
      summary: 会话列表（班级 / 课程 / 时间三列展示）
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SessionStatus' }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPageResp' }
    post:
      tags: [admin-session]
      summary: 发起签到（必须同时传 classId 与 courseId）
      description: |
        校验顺序：缺字段 → `FA-2001`；班级/课程不存在 → `FA-2001`；
        未授权（未同时命中 teacher_scope 的 CLASS 与 COURSE）→ `FA-2006`；
        已归档 → `FA-2004`。
        创建时快照应到名单 = `students WHERE class_id=? AND status='ACTIVE'`，
        写入 `expected_count` 供大屏展示，**与 courseId 无关**（D7）。
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateReq' }
      responses:
        '200':
          description: 已发起
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-error-codes: [FA-2001, FA-2004, FA-2006]

  /api/v1/admin/sessions/{id}/close:
    post:
      tags: [admin-session]
      summary: 结束签到（未签到者补 ABSENT，幂等）
      description: 只能结束自己发起的会话；重复调用返回同样的结果，不报错。
      operationId: closeSession
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已关闭
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-3001, FA-5002]

  /api/v1/admin/sessions/{id}/live:
    get:
      tags: [admin-session]
      summary: WebSocket 实时名单
      description: |
        `101 Switching Protocols`，JWT 走 query `?token=`。订阅 `session:{sessionId}`，
        收到 `EVT_CHECKIN_SUCCESS` 增量推送。**登记用，不参与代码生成。**
      operationId: sessionLiveWs
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: 协议升级成功
      x-websocket-events: [EVT_CHECKIN_SUCCESS, EVT_SESSION_CLOSED]

  # ===================================================================
  # admin · 考勤
  # ===================================================================
  /api/v1/admin/attendance:
    get:
      tags: [admin-attendance]
      summary: 考勤查询
      operationId: listAttendance
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sessionId
          in: query
          schema: { type: integer, format: int64 }
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceStatus' }
        - name: studentKeyword
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendancePageResp' }

  /api/v1/admin/attendance/{id}:
    patch:
      tags: [admin-attendance]
      summary: 手动改状态（必须带 adjustReason）
      description: 用于标记请假 / 免签 / 纠正迟到。改动写 `adjusted_by`、`adjust_reason` 并留审计。
      operationId: patchAttendance
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendancePatchReq' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/attendance/export:
    get:
      tags: [admin-attendance]
      summary: 导出 Excel（缺勤行高亮）
      operationId: exportAttendance
      parameters:
        - name: sessionId
          in: query
          schema: { type: integer, format: int64 }
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          schema: { type: integer, format: int64 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Excel 文件（.xlsx），缺勤（ABSENT）学生整行红底高亮
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ===================================================================
  # admin · 申诉
  # ===================================================================
  /api/v1/admin/appeals:
    get:
      tags: [admin-appeal]
      summary: 申诉列表（默认 PENDING 优先）
      operationId: listAppeals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppealStatus' }
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealPageResp' }

  /api/v1/admin/appeals/{id}/handle:
    post:
      tags: [admin-appeal]
      summary: 处理申诉（通过 → 考勤变 PRESENT，同一事务）
      operationId: handleAppeal
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealHandleReq' }
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-error-codes: [FA-5001, FA-5002]

  # ===================================================================
  # admin · 统计 / 审计 / 配置
  # ===================================================================
  /api/v1/admin/stats/overview:
    get:
      tags: [admin-system]
      summary: 概览（班级与课程双维度下钻）
      operationId: statsOverview
      parameters:
        - name: classId
          in: query
          schema: { type: integer, format: int64 }
        - name: courseId
          in: query
          schema: { type: integer, format: int64 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 指标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverviewResp' }

  /api/v1/admin/audit-logs:
    get:
      tags: [admin-system]
      summary: 审计查询（仅 ADMIN）
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: actorId
          in: query
          schema: { type: integer, format: int64 }
        - name: action
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPageResp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/config:
    get:
      tags: [admin-system]
      summary: 系统配置（仅 ADMIN）
      operationId: getConfig
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [FACE, CHECKIN, AGENT, SYSTEM] }
      responses:
        '200':
          description: 配置项列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigListResp' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-system]
      summary: 修改配置（仅 ADMIN；editable=0 的项拒绝修改）
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigUpdateReq' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigListResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/agent/session:
    post:
      tags: [admin-system]
      summary: 换取 Agent 一次性 code（用于嵌入 Streamlit）
      description: |
        返回 60 秒单次消费的 code；Agent 服务用 `POST /agent/sso/exchange` 换成会话 token。
        **不把 JWT 放进 URL**，避免被 nginx 日志记录（D6）。
      operationId: agentSessionCode
      responses:
        '200':
          description: code 与到期时间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCodeResp' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: 从 1 起
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: 默认 20，上限 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PathSessionId:
      name: sid
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 参数错误（FA-2001 的 400 变体、FA-3002、FA-4003 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
    Unauthorized:
      description: 未认证或令牌失效（FA-1001 / FA-1002）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
    Forbidden:
      description: 权限不足或超数据范围（FA-1003 / FA-2006 / FA-3004 / FA-5002）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
    NotFound:
      description: 资源不存在（FA-2001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
    Conflict:
      description: 状态冲突（FA-1004 / FA-2002 / FA-2003 / FA-2005 / FA-3001 / FA-3003 / FA-4008 / FA-5001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
    TooManyRequests:
      description: 限流（FA-3005 或登录失败锁定）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }

  schemas:
    # ---------- 响应包 ----------
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          pattern: '^FA-\d{4}$'
          example: FA-0000
        message: { type: string, example: ok }
        traceId: { type: string, example: b1f2c3d4e5 }
      additionalProperties: false

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: 部分错误码需要补充信息，例如 FA-2005 的 studentCount、FA-4003 的 hint

    EmptyResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    # ---------- 枚举 ----------
    Role:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]
    StudentStatus:
      type: string
      enum: [ACTIVE, TRANSFERRED, ARCHIVED]
    OrgStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    SessionStatus:
      type: string
      enum: [ACTIVE, CLOSED, CANCELLED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, LATE, ABSENT, LEAVE, EXEMPT]
    AppealStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
    FaceProfileStatus:
      type: string
      enum: [NONE, PENDING_REVIEW, ACTIVE, REJECTED]
    ScopeType:
      type: string
      enum: [CLASS, COURSE]
      description: ★ 只有这两种；不是「课程属于班级」的表达，而是授权维度（D7）

    # ---------- 认证 ----------
    LoginReq:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 6, maxLength: 64, format: password }

    StudentActivateReq:
      type: object
      additionalProperties: false
      required: [studentNo, name, classCode, password]
      properties:
        studentNo: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 64 }
        classCode: { type: string, maxLength: 32, description: 班级邀请码 }
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: 至少 8 位，须含字母与数字

    TokenData:
      type: object
      required: [accessToken, refreshToken, role, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expiresIn: { type: integer, description: accessToken 剩余秒数 }
        profile: { $ref: '#/components/schemas/Profile' }

    TokenResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenData' }

    LoginResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenData' }

    Profile:
      type: object
      description: 当前用户档案。学生只有本人数据；教师带授权范围
      properties:
        id: { type: integer, format: int64, description: account.id }
        username: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        teacherId: { type: integer, format: int64, nullable: true }
        studentId: { type: integer, format: int64, nullable: true }
        classId: { type: integer, format: int64, nullable: true, description: 仅学生有 }
        className: { type: string, nullable: true }
        faceStatus: { $ref: '#/components/schemas/FaceProfileStatus' }

    MeData:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            permissions:
              type: array
              items: { type: string }
              description: 权限点，供前端 v-permission 使用
            scope:
              type: object
              description: 教师的可用范围；ADMIN 为全量
              properties:
                classIds: { type: array, items: { type: integer, format: int64 } }
                courseIds: { type: array, items: { type: integer, format: int64 } }

    MeResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MeData' }

    # ---------- 班级 ----------
    Class:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 创建后不可修改 }
        name: { type: string }
        grade: { type: string, nullable: true }
        major: { type: string, nullable: true }
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        ownerTeacherName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrgStatus' }
        remark: { type: string, nullable: true }
        studentCount: { type: integer, description: 在读学生数，列表页直接用，避免二次请求 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClassCreateReq:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9]{4,32}$'
          description: 4~32 位字母数字，全局唯一，创建后不可修改
        name: { type: string, minLength: 1, maxLength: 120 }
        grade: { type: string, maxLength: 16, nullable: true }
        major: { type: string, maxLength: 120, nullable: true }
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        remark: { type: string, maxLength: 255, nullable: true }

    ClassUpdateReq:
      type: object
      additionalProperties: false
      description: ★ 不含 code —— 班级码被学生用于激活，创建后不可改
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        grade: { type: string, maxLength: 16, nullable: true }
        major: { type: string, maxLength: 120, nullable: true }
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        status: { $ref: '#/components/schemas/OrgStatus' }
        remark: { type: string, maxLength: 255, nullable: true }

    ClassResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Class' }

    ClassPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Class' } }

    # ---------- 课程 ----------
    Course:
      type: object
      description: ★ 结构中不存在 classId。出现即契约违规（§16.3 场景 16）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 创建后不可修改 }
        name: { type: string }
        semester: { type: string, nullable: true }
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        ownerTeacherName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrgStatus' }
        remark: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CourseCreateReq:
      type: object
      additionalProperties: false
      required: [code, name]
      description: ★ 提交 classId 会被 400 拒绝（additionalProperties=false + 服务端未知字段校验）
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]{2,32}$'
          description: 2~32 位大写字母数字，全局唯一，创建后不可修改
        name: { type: string, minLength: 1, maxLength: 120, description: 允许重名，唯一性靠 code }
        semester:
          type: string
          maxLength: 32
          nullable: true
          pattern: '^\d{4}-\d{4}-[12]$'
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        remark: { type: string, maxLength: 255, nullable: true }

    CourseUpdateReq:
      type: object
      additionalProperties: false
      description: ★ 不含 code，也不含任何班级字段
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        semester: { type: string, maxLength: 32, nullable: true }
        ownerTeacherId: { type: integer, format: int64, nullable: true }
        status: { $ref: '#/components/schemas/OrgStatus' }
        remark: { type: string, maxLength: 255, nullable: true }

    CourseResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Course' }

    CoursePageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Course' } }

    DeleteResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        archived:
          type: boolean
          description: true = 因被引用而转 ARCHIVED；false = 物理删除

    DeleteResultResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DeleteResult' }

    # ---------- CR-026 课程授权学生 ----------
    CourseGrantReq:
      type: object
      additionalProperties: false
      required: [studentId]
      description: ★ 不含 classId——学生的班级由后端读 student.class_id 现值决定，「选择班级」只是前端选择器交互
      properties:
        studentId: { type: integer, format: int64 }

    CourseGrant:
      type: object
      description: 授权行。业务键只有 courseId + studentId；姓名/学号/班级为展示冗余
      properties:
        id: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        studentId: { type: integer, format: int64 }
        studentName: { type: string, nullable: true }
        studentNo: { type: string, nullable: true }
        classId: { type: integer, format: int64, nullable: true }
        className: { type: string, nullable: true }
        grantedBy: { type: integer, format: int64, nullable: true, description: 操作人 account.id（审计冗余） }
        createdAt: { type: string, format: date-time }

    CourseGrantResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CourseGrant' }

    CourseGrantPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/CourseGrant' } }

    # ---------- 学生 ----------
    Student:
      type: object
      properties:
        id: { type: integer, format: int64 }
        studentNo: { type: string }
        name: { type: string }
        classId: { type: integer, format: int64 }
        className: { type: string }
        status: { $ref: '#/components/schemas/StudentStatus' }
        activated: { type: boolean, description: account_id 是否已回填 }
        faceStatus: { $ref: '#/components/schemas/FaceProfileStatus' }
        createdAt: { type: string, format: date-time }

    StudentCreateReq:
      type: object
      additionalProperties: false
      required: [studentNo, name, classId]
      properties:
        studentNo: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 64 }
        classId: { type: integer, format: int64 }

    StudentUpdateReq:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        classId: { type: integer, format: int64, description: 改动即视为转班，写审计 }
        status: { $ref: '#/components/schemas/StudentStatus' }

    StudentResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Student' }

    StudentPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Student' } }

    ImportRowError:
      type: object
      required: [line, reason]
      properties:
        line: { type: integer, description: CSV 行号，从 1 起（含表头） }
        studentNo: { type: string, nullable: true }
        reason: { type: string }

    ImportResult:
      type: object
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        errors: { type: array, items: { $ref: '#/components/schemas/ImportRowError' } }

    ImportResultResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ImportResult' }

    # ---------- 人脸 ----------
    FaceEnrollReq:
      type: object
      additionalProperties: false
      required: [sampleKeys, consentVersion]
      properties:
        sampleKeys:
          type: array
          minItems: 5
          maxItems: 10
          items: { type: string }
          description: 已加密上传的样本对象键
        consentVersion:
          type: string
          maxLength: 16
          description: |
            必须等于当前生效的同意书版本（v2），且已有对应 ACCEPT 事件
            （POST /api/v1/mobile/face/consent 落库），否则 404 FA-2001（CR-028 服务端强校验）

    FaceConsentReq:
      type: object
      additionalProperties: false
      required: [consentVersion]
      properties:
        consentVersion:
          type: string
          maxLength: 16
          description: 同意书版本，必须是服务端当前生效版本（v2）；旧版本视为已停用

    FaceReviewReq:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved: { type: boolean }
        rejectReason:
          type: string
          maxLength: 255
          description: approved=false 时必填

    FaceStatus:
      type: object
      properties:
        studentId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/FaceProfileStatus' }
        sampleCount: { type: integer }
        submittedAt: { type: string, format: date-time, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        rejectReason: { type: string, nullable: true }
        consentVersion:
          type: string
          nullable: true
          description: 当前生效的同意书版本；撤回或删除人脸数据后为 null（CR-028）
        consentAt:
          type: string
          format: date-time
          nullable: true
          description: 首次单独同意的时间；撤回或删除人脸数据后为 null（CR-028）

    FaceStatusResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/FaceStatus' }

    # ---------- 教师 ----------
    Teacher:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teacherNo: { type: string }
        name: { type: string }
        department: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        classCount: { type: integer, description: 已授权班级数 }
        courseCount: { type: integer, description: 已授权课程数 }

    TeacherCreateReq:
      type: object
      additionalProperties: false
      required: [teacherNo, name, password]
      description: ★ 没有 role 字段 —— 新建教师的角色恒为 TEACHER（§8.2）
      properties:
        teacherNo: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 64, format: password }
        department: { type: string, maxLength: 120, nullable: true }
        title: { type: string, maxLength: 64, nullable: true }

    TeacherUpdateReq:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        department: { type: string, maxLength: 120, nullable: true, description: 空串表示清空 }
        title: { type: string, maxLength: 64, nullable: true, description: 空串表示清空 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        password:
          type: string
          minLength: 8
          maxLength: 64
          nullable: true
          writeOnly: true
          description: |
            管理员直接重置密码（教师忘记密码时的兜底；教师自助改密走 profile-requests 审批链）。
            不传表示不改；重置后该账号 credential_version +1，此前签发的令牌立即失效。

    TeacherResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Teacher' }

    TeacherPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Teacher' } }

    # ---------- 教师账号与资料修改申请（CR-019 / CR-022） ----------
    ProfileRequestSubmitReq:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64, nullable: true, description: 留空表示不申请改姓名 }
        department: { type: string, maxLength: 120, nullable: true, description: 空串表示清空院系 }
        title: { type: string, maxLength: 64, nullable: true, description: 空串表示清空职称 }
        username:
          type: string
          maxLength: 32
          nullable: true
          description: 新登录用户名（teacher_no 与 account.username 双写）；不能含空格，与当前一致视为不申请
        currentPassword:
          type: string
          maxLength: 64
          nullable: true
          writeOnly: true
          description: 当前密码，仅用于确认本人操作；不落库、不回显
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          nullable: true
          writeOnly: true
          description: 新密码，8~64 位且同时含字母与数字；服务端只保存 BCrypt 哈希
        reason: { type: string, maxLength: 500, nullable: true }

    ProfileRequestHandleReq:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved: { type: boolean }
        note: { type: string, maxLength: 500, nullable: true, description: 驳回时必填 }

    ProfileRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teacherId: { type: integer, format: int64 }
        teacherNo: { type: string, description: 教师当前登录用户名，不是申请值 }
        teacherName: { type: string, description: 教师当前姓名，不是申请值 }
        oldUsername: { type: string, nullable: true, description: 提交时刻的登录用户名快照 }
        oldName: { type: string, nullable: true }
        oldDepartment: { type: string, nullable: true }
        oldTitle: { type: string, nullable: true }
        newUsername: { type: string, nullable: true, description: 申请的新登录用户名；null 表示未申请 }
        newName: { type: string, nullable: true }
        newDepartment: { type: string, nullable: true }
        newTitle: { type: string, nullable: true }
        passwordChange: { type: boolean, description: 是否申请重置密码；任何情况下都不返回哈希 }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN] }
        reviewNote: { type: string, nullable: true }
        reviewerUsername: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ProfileRequestResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProfileRequest' }

    ProfileRequestPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/ProfileRequest' } }

    # ---------- 学生密码修改申请（CR-024） ----------
    StudentProfileRequestSubmitReq:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 64
          writeOnly: true
          description: 当前密码，仅用于确认本人操作；不落库、不回显
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: 新密码，8~64 位且同时含字母与数字；服务端只保存 BCrypt 哈希
        reason: { type: string, maxLength: 500, nullable: true, description: 学生填写的申请说明，选填 }

    StudentProfileRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        studentId: { type: integer, format: int64 }
        studentNo: { type: string, description: 学生当前学号（登录名），不是申请值——学生不能申请改学号 }
        studentName: { type: string, description: 学生当前姓名，不是申请值 }
        className: { type: string, nullable: true, description: 学生当前班级名，便于管理员辨认 }
        passwordChange: { type: boolean, description: 恒为 true；字段保留以与教师申请响应同构 }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN] }
        reviewNote: { type: string, nullable: true }
        reviewerUsername: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    StudentProfileRequestResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StudentProfileRequest' }

    StudentProfileRequestPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/StudentProfileRequest' } }

    # ---------- 授权范围 ----------
    Scope:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teacherId: { type: integer, format: int64 }
        teacherName: { type: string }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { type: integer, format: int64 }
        scopeName: { type: string, description: 班级名或课程名 }
        grantedBy: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }

    ScopeCreateReq:
      type: object
      additionalProperties: false
      required: [teacherId, scopeType, scopeId]
      properties:
        teacherId: { type: integer, format: int64 }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { type: integer, format: int64 }

    ScopeResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Scope' }

    ScopeListResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Scope' } }

    # ---------- 签到会话 ----------
    Session:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        classId: { type: integer, format: int64 }
        className: { type: string, description: ★ 与 courseName 必须并列展示，避免选错组合 }
        courseId: { type: integer, format: int64 }
        courseName: { type: string }
        teacherId: { type: integer, format: int64 }
        teacherName: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        lateAfterSec: { type: integer }
        allowAppeal: { type: boolean }
        expectedCount: { type: integer, description: 应到人数快照 }
        presentCount: { type: integer }
        lateCount: { type: integer }
        absentCount: { type: integer }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SessionCreateReq:
      type: object
      additionalProperties: false
      required: [classId, courseId, title, durationMinutes]
      properties:
        classId: { type: integer, format: int64, description: ★ 必填，决定应到名单 }
        courseId: { type: integer, format: int64, description: ★ 必填，仅用于统计口径 }
        title: { type: string, minLength: 1, maxLength: 120 }
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 240
          description: 服务端换算 end_at = start_at + durationMinutes
        lateAfterSec:
          type: integer
          minimum: 0
          maximum: 7200
          default: 300
        allowAppeal: { type: boolean, default: true }

    SessionResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Session' }

    SessionPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Session' } }

    # ---------- 移动端 ----------
    ActiveSession:
      type: object
      properties:
        sessionId: { type: integer, format: int64 }
        title: { type: string }
        className: { type: string }
        courseName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        remainingSec: { type: integer }
        myStatus:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, PRESENT, LATE]
          description: IN_PROGRESS = 已 join 未完成
        appealStatus:
          # OAS 3.0 的 nullable 不能挂在 $ref 上，这里直接内联枚举，与 AppealStatus 保持一致
          type: string
          nullable: true
          enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
          description: |
            本人对该场次**最新一条**申诉的状态；从未申诉为 null。
            为 PENDING 时前端显示「申诉中」，并且 join 会以 FA-5001 拒绝再次进入
            —— 已提交申诉的场次不可再参与签到。REJECTED / WITHDRAWN 之后仍可正常签到。
        retryLeft:
          type: integer
          description: |
            剩余可重试次数（CR-023）。0 = 识别失败已达上限：首页显示「识别失败」
            并拒绝点击，join 会以 FA-3005 拒绝。已签成功（PRESENT/LATE）时无意义，
            前端不读。

    ActiveSessionListResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } }

    JoinData:
      type: object
      required: [checkinTicket, ttl, className, courseName, challengeRequired]
      properties:
        checkinTicket: { type: string, description: '短期票据，TTL 60s，直连 /face-api 用' }
        ttl: { type: integer, description: 票据剩余秒数 }
        className: { type: string }
        courseName: { type: string }
        sessionTitle: { type: string }
        remainingSec: { type: integer, description: 会话剩余秒数 }
        challengeRequired: { type: boolean, description: 人脸档案 ACTIVE 时必须为 true }
        retryLeft: { type: integer }

    JoinResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/JoinData' }

    MobileAttendance:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: attendance 主键；**还没有考勤记录时为 0**
        sessionId: { type: integer, format: int64 }
        sessionTitle: { type: string }
        className: { type: string }
        courseName: { type: string }
        status:
          # OAS 3.0 里 nullable 必须与 type 同级，不能挂在 allOf 上；枚举值与 AttendanceStatus 保持一致
          type: string
          nullable: true
          enum: [PRESENT, LATE, ABSENT, LEAVE, EXEMPT]
          description: |
            会话进行中、本人尚未签到成功时没有 attendance 行，这里返回 **null**
            （不再返回 FA-2001，否则学生刷脸失败后连申诉页都打不开）。
        checkinAt: { type: string, format: date-time, nullable: true }
        canAppeal:
          type: boolean
          description: |
            缺勤（ABSENT）与迟到（LATE）可申诉；会话进行中尚未签成功（status=null）同样可申诉。
            已签成功 / 请假 / 免签为 false；已有在办申诉（PENDING/APPROVED）或会话关闭申诉入口时为 false。
        appealId: { type: integer, format: int64, nullable: true }
        appealStatus: { $ref: '#/components/schemas/AppealStatus' }

    MobileAttendanceResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MobileAttendance' }

    MobileHistoryResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/MobileAttendance' } }

    # ---------- 考勤 ----------
    Attendance:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        sessionTitle: { type: string }
        classId: { type: integer, format: int64 }
        className: { type: string }
        courseId: { type: integer, format: int64 }
        courseName: { type: string }
        studentId: { type: integer, format: int64 }
        studentNo: { type: string }
        studentName: { type: string }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        checkinAt: { type: string, format: date-time, nullable: true }
        similarity: { type: number, format: double, nullable: true }
        livenessMedian: { type: number, format: double, nullable: true }
        identitySim: { type: number, format: double, nullable: true }
        actionCount: { type: integer, nullable: true }
        actionSeq: { type: string, nullable: true }
        rejectGate:
          type: string
          nullable: true
          enum: [liveness, identity, action_count, multi_face, no_face, match]
          description: ★ 小写，与 §13.2 逐字一致；失败时必须非空
        adjustReason: { type: string, nullable: true }
        adjustedBy: { type: integer, format: int64, nullable: true }

    AttendanceResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Attendance' }

    AttendancePageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Attendance' } }

    AttendancePatchReq:
      type: object
      additionalProperties: false
      required: [status, adjustReason]
      properties:
        status:
          type: string
          enum: [PRESENT, LATE, ABSENT, LEAVE, EXEMPT]
          description: 教师手动可设的全部值
        adjustReason: { type: string, minLength: 2, maxLength: 255 }

    # ---------- 申诉 ----------
    Appeal:
      type: object
      properties:
        id: { type: integer, format: int64 }
        attendanceId: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        sessionTitle: { type: string }
        studentId: { type: integer, format: int64 }
        studentNo: { type: string }
        studentName: { type: string }
        className: { type: string }
        courseName: { type: string }
        reason: { type: string }
        evidenceUrl:
          type: string
          nullable: true
          description: 带签名的临时访问链接，不直出对象键
        status: { $ref: '#/components/schemas/AppealStatus' }
        reply: { type: string, nullable: true }
        handledBy: { type: integer, format: int64, nullable: true }
        handledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        rejectGate:
          type: string
          nullable: true
          description: 原签到失败的门禁，帮教师判断是否误伤

    AppealCreateReq:
      type: object
      additionalProperties: false
      required: [sessionId, reason]
      properties:
        sessionId: { type: integer, format: int64 }
        reason: { type: string, minLength: 5, maxLength: 500 }
        evidenceKey: { type: string, maxLength: 255, nullable: true }

    AppealHandleReq:
      type: object
      additionalProperties: false
      required: [approved, reply]
      properties:
        approved: { type: boolean }
        reply: { type: string, minLength: 2, maxLength: 500, description: 无论通过与否都必须给理由 }

    AppealResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Appeal' }

    AppealPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/Appeal' } }

    # ---------- 统计 / 审计 / 配置 ----------
    Overview:
      type: object
      properties:
        todaySessions: { type: integer }
        todayExpected: { type: integer }
        todayPresent: { type: integer }
        todayRate:
          type: number
          format: double
          description: '(PRESENT + LATE) / 应到人数；LEAVE/EXEMPT 进分母不进分子'
        pendingAppeals: { type: integer }
        trend:
          type: array
          description: 近 7 天签到率
          items:
            type: object
            properties:
              date: { type: string, format: date }
              rate: { type: number, format: double }
              expected: { type: integer }
              present: { type: integer }

    OverviewResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Overview' }

    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64, nullable: true }
        actorName: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: integer, format: int64, nullable: true }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        clientIp: { type: string, nullable: true, description: 展示层已脱敏到 /24 }
        traceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AuditPageResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

    ConfigItem:
      type: object
      properties:
        configKey: { type: string }
        configValue: { type: string }
        valueType: { type: string, enum: [INT, DECIMAL, BOOL, STRING, JSON] }
        category: { type: string, enum: [FACE, CHECKIN, AGENT, SYSTEM] }
        description: { type: string, nullable: true }
        editable:
          type: boolean
          description: false 表示由标定脚本写入，管理端只读
        updatedAt: { type: string, format: date-time }

    ConfigListResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ConfigItem' } }

    ConfigUpdateReq:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [configKey, configValue]
            properties:
              configKey: { type: string }
              configValue: { type: string }

    AgentCodeData:
      type: object
      properties:
        code: { type: string, description: 60 秒单次消费 }
        expiresAt: { type: string, format: date-time }
        agentUrl: { type: string, description: '/agent/?code=...' }

    AgentCodeResp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AgentCodeData' }
