# =====================================================================
# 站点配置（§12.2）
# 入口只有 nginx：java / face / agent / mysql / redis / minio 都不映射宿主机端口。
# =====================================================================

# ---- HTTP：只保留健康检查与跳转 ----
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ACME 预留给 certbot；自签证书部署可忽略
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    # nginx 1.24 的写法；1.25+ 才支持独立的 `http2 on;`
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # §13.3：TLS 1.2+；关闭不安全的套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 根路径 → 管理端 ----
    location = / {
        return 302 /admin/;
    }

    # ---- 管理端 SPA ----
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 移动端 SPA（history 回退）----
    location /m/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 二维码里的短链 /checkin?sid=&tk= → 移动端 /m/checkin（保留 query）
    location = /checkin {
        return 302 /m/checkin$is_args$args;
    }
    location /checkin/ {
        return 302 /m/checkin/$is_args$args;
    }

    # ---- Java API + WebSocket（大屏 /api/v1/admin/sessions/{id}/live）----
    location /api/ {
        proxy_pass http://java:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization 默认透传，这里显式写出来便于审计
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    3600s;
    }

    # ---- 人脸服务：8MB 上限、关缓冲降延迟、按 IP 限流 ----
    location /face-api/ {
        limit_req zone=face_api burst=20 nodelay;
        proxy_pass http://face:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- Agent（Streamlit）：去 X-Frame-Options 以支持 iframe ----
    location = /agent {
        return 302 /agent/;
    }
    location /agent/ {
        proxy_pass http://agent:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
